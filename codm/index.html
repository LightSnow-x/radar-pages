  <h1>使命召唤手游</h1>
  <p>输入共享设备上的四位房间号。</p>
  <form action="./view.html" method="get">

    <input id="room" name="room" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" required>
