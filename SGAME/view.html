<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a131b">
  <meta name="referrer" content="no-referrer">
  <title>峡谷战况 · 王者荣耀雷达</title>
  <link rel="stylesheet" href="./radar.css?v=afa27b9f1c6a">
  <script defer src="../transport.js?v=cebbfdc810eb" data-game="sgame" data-endpoint="wss://xiaoxue.aaocc.cn:19560/radar-ws"></script>
  <script type="module" src="./radar.js?v=afa27b9f1c6a"></script>
</head>
<body class="viewer-page" data-mode="web">
  <header class="site-header wrap">
    <a href="./" class="brand" aria-label="王者荣耀雷达首页">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>王者荣耀</span>
    </a>
    <nav class="header-nav" aria-label="雷达导航">
      <span class="mode-label web-only">网页雷达</span>
      <span class="mode-label lan-only">局域网雷达</span>
      <a id="change-room" href="./">更换房间</a>
    </nav>
  </header>

  <main class="viewer wrap">
    <header class="viewer-heading">
      <h1>峡谷战况</h1>
      <p id="connection" class="connection" data-state="waiting" role="status">正在连接</p>
    </header>
    <div class="board">
      <section class="terrain" aria-label="对局地图">
        <div class="terrain-header">
          <h2 id="map-name">对局地图</h2>
          <button id="rotate-map" class="quiet-button" type="button" aria-pressed="false" disabled>旋转地图</button>
        </div>
        <div id="map-surface" class="map-surface">
          <img id="map-image" class="map-image" width="702" height="702" alt="" hidden>
          <canvas id="markers" aria-label="地图上的实时位置" role="img" hidden></canvas>
          <div class="map-message" id="map-message">
            <p id="map-message-title">正在连接房间</p>
            <p id="map-message-detail">连接成功后自动同步对局。</p>
            <button id="reconnect" class="quiet-button" type="button" hidden>重新连接</button>
          </div>
        </div>
        <p id="map-note" class="map-note" hidden></p>
      </section>

      <aside class="viewer-side" aria-label="房间和地图图层">
        <dl class="room-details">
          <div><dt>房间号</dt><dd id="room-number">—</dd></div>
          <div><dt>观看人数</dt><dd id="viewers">—</dd></div>
        </dl>
        <fieldset class="layer-options" id="layer-options">
          <legend>地图图层</legend>
          <label><span><i class="legend-symbol own" aria-hidden="true"></i>自身</span><input type="checkbox" name="self" checked></label>
          <label><span><i class="legend-symbol hero-unit" aria-hidden="true"></i>英雄</span><input type="checkbox" name="heroes" checked></label>
          <label><span><i class="legend-symbol structure" aria-hidden="true"></i>防御塔与基地</span><input type="checkbox" name="structures" checked aria-describedby="structure-status"></label>
          <label><span><i class="legend-symbol monster" aria-hidden="true"></i>野区营地</span><input type="checkbox" name="monsters" checked></label>
          <p id="structure-status" class="layer-note" hidden>当前对局未提供防御塔与基地位置。</p>
        </fieldset>
      </aside>
    </div>
    <noscript><p class="no-script">请启用 JavaScript，浏览器才能接收实时对局数据。</p></noscript>
  </main>
</body>
</html>
