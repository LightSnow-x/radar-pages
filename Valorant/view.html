<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111c22">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='6' fill='%23111c22'/%3E%3Cpath d='M5 8v11l12 13h11L5 8Zm30 0L24 20h8l3-4Z' fill='%23ff5260'/%3E%3C/svg%3E">
  <title>局域网雷达 · 无畏契约：源能行动</title>
  <link rel="stylesheet" href="../connection.css">
  <script defer src="../transport.js?v=dd54b5e5a73f" data-game="valorant" data-endpoint="wss://xue.stancc.xyz/radar-ws" data-fallback-endpoint="wss://xiaoxue.aaocc.cn/radar-ws"></script>
  <link rel="stylesheet" href="radar.css">
  <script type="module" src="radar.mjs"></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <symbol id="i-radar" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15 8a5 5 0 1 0 2 4M12 12l8-8"/><circle cx="9" cy="14" r="1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M2 8.5a16 16 0 0 1 20 0M5.5 12a10.5 10.5 0 0 1 13 0M9 15.5a5 5 0 0 1 6 0"/><circle cx="12" cy="19" r="1.4" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-offline" viewBox="0 0 24 24"><path d="m3 3 18 18M2 8.5a16 16 0 0 1 3-1.8m4-1.2A16 16 0 0 1 22 8.5M5.5 12a10.5 10.5 0 0 1 4-2m-1 5.8a5 5 0 0 1 5.3-.8"/><circle cx="12" cy="19" r="1.4" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m2.5 7.5 9.5-5 9.5 5-9.5 5zM3 12l9 4.8 9-4.8M3 16.6l9 4.8 9-4.8"/></symbol>
    <symbol id="i-roster" viewBox="0 0 24 24"><path d="M2.5 20v-2.5c0-2.1 3.2-4 7-4s7 1.9 7 4V20M15.5 5.2a3.4 3.4 0 0 1 0 6.6M18.2 14.4c2 .7 3.3 1.9 3.3 3.3V20"/><circle cx="9.5" cy="7.5" r="3.5"/></symbol>
    <symbol id="i-portrait" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="12" cy="9.5" r="3"/><path d="M6 19c.4-3.4 2.7-5 6-5s5.6 1.6 6 5"/></symbol>
    <symbol id="i-distance" viewBox="0 0 24 24"><path d="M3 5v14m18-14v14M4 12h16m-12-3-3 3 3 3m8-6 3 3-3 3"/></symbol>
    <symbol id="i-follow" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="2"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/></symbol>
    <symbol id="i-overview" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/><path d="m7 15 3-6 4 4 3-6"/></symbol>
    <symbol id="i-beam" viewBox="0 0 24 24"><path d="m5 18 4-14a16 16 0 0 1 12 11L7 20"/><circle cx="5" cy="19" r="2"/><path d="m9 15 5-5"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M3 6h8m6 0h4M3 12h2m6 0h10M3 18h11m6 0h1"/><circle cx="14" cy="6" r="2.5"/><circle cx="8" cy="12" r="2.5"/><circle cx="17" cy="18" r="2.5"/></symbol>
    <symbol id="i-health" viewBox="0 0 24 24"><path d="M2 12h5l3-8 4 16 3-8h5"/></symbol>
    <symbol id="i-self" viewBox="0 0 24 24"><path id="shape-self" fill-rule="evenodd" d="M12 1a11 11 0 1 1 0 22 11 11 0 1 1 0-22Zm0 4a7 7 0 1 0 0 14 7 7 0 1 0 0-14Zm0 4a3 3 0 1 1 0 6 3 3 0 1 1 0-6Z"/></symbol>
    <symbol id="i-ally" viewBox="0 0 24 24"><path id="shape-ally" fill-rule="evenodd" d="M2 3h20v9c0 5-6 9-10 11C8 21 2 17 2 12Zm5 5v4l5 3 5-3V8l-5 3Z"/></symbol>
    <symbol id="i-enemy" viewBox="0 0 24 24"><path id="shape-enemy" fill-rule="evenodd" d="m12 0 12 12-12 12L0 12Zm-1.5 6v8h3V6Zm0 10v2.5h3V16Z"/></symbol>
  </svg>
  <header class="masthead">
    <div class="mast-inner">
      <div class="brand">
        <svg class="crest" viewBox="0 0 40 32" aria-hidden="true"><path d="M1 2v13.5L14.4 30H28L1 2Zm38 0L26.4 15.8h9.3l3.3-3.6V2Z"/></svg>
        <span>无畏契约<small>源能行动</small></span>
      </div>
      <span class="view-name"><svg class="icon" aria-hidden="true"><use href="#i-radar"/></svg>战术雷达</span>
      <div class="connection" data-state="connecting" role="status">
        <svg class="icon" aria-hidden="true"><use id="connection-icon" href="#i-wifi"/></svg><span id="connection">正在连接</span>
      </div>
      <div class="menu-anchor" id="menu-anchor">
        <button type="button" id="menu-toggle" aria-controls="radar-menu" aria-expanded="false">
          <svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg>菜单<span class="chevron" aria-hidden="true"></span>
        </button>
        <aside id="radar-menu" aria-label="雷达菜单" hidden>
          <a id="change-room" class="room-link" hidden>更换房间</a>
          <fieldset class="viewpoints"><legend><span><svg class="icon" aria-hidden="true"><use href="#i-follow"/></svg>观测视角</span></legend>
            <div class="view-options" id="view-options"></div>
            <p class="side-note" id="follow-note" role="status" hidden></p>
          </fieldset>
          <fieldset class="layers"><legend><span><svg class="icon" aria-hidden="true"><use href="#i-layers"/></svg>地图图层</span></legend>
            <label><svg class="marker ally" aria-hidden="true"><use href="#i-ally"/></svg>队友位置<input type="checkbox" role="switch" id="allies" checked></label>
            <label><svg class="marker enemy" aria-hidden="true"><use href="#i-enemy"/></svg>敌方位置<input type="checkbox" role="switch" id="enemies" checked></label>
            <label><svg class="icon" aria-hidden="true"><use href="#i-portrait"/></svg>英雄头像<input type="checkbox" role="switch" id="portraits" checked></label>
            <label><svg class="icon" aria-hidden="true"><use href="#i-health"/></svg>血量<input type="checkbox" role="switch" id="health" checked></label>
            <label><svg class="icon" aria-hidden="true"><use href="#i-distance"/></svg>距离<input type="checkbox" role="switch" id="distance" checked></label>
            <label><svg class="icon" aria-hidden="true"><use href="#i-beam"/></svg>视角转向灯<input type="checkbox" role="switch" id="headings" checked></label>
          </fieldset>
          <section aria-labelledby="roster-title">
            <h2 id="roster-title"><svg class="icon" aria-hidden="true"><use href="#i-roster"/></svg>场上英雄<span class="count" id="count">—</span></h2>
            <ul id="roster" class="roster"></ul>
            <p class="side-note" id="roster-empty">等待对局数据</p>
          </section>
        </aside>
      </div>
    </div>
  </header>
  <main class="workspace">
    <section class="board" aria-labelledby="map-title">
      <header class="board-head">
        <div class="map-heading"><p id="view-caption">当前对局</p><h1 id="map-title">等待地图</h1></div>
        
      </header>
      <div class="viewer">
        <canvas id="map-canvas" role="img" aria-label="当前地图、英雄位置、视角朝向、血量和距离"></canvas>
        <div class="empty" id="map-empty">
          <svg class="empty-icon icon" aria-hidden="true"><use id="empty-icon" href="#i-radar"/></svg>
          <p id="empty-message" role="status">正在连接游戏设备…</p>
        </div>
      </div>
      <footer class="board-foot">
        <div class="legend" id="legend" aria-label="地图图例">
          <span><svg class="marker self" aria-hidden="true"><use href="#i-self"/></svg>自己</span>
          <span><svg class="marker ally" aria-hidden="true"><use href="#i-ally"/></svg>队友</span>
          <span><svg class="marker enemy" aria-hidden="true"><use href="#i-enemy"/></svg>敌方</span>
          <span id="site-legend" hidden><b class="site-key" aria-hidden="true">A</b>部署区</span>
        </div>
        <span id="frame-status"></span>
      </footer>
    </section>
  </main>
<p id="pages-connection" role="status" hidden></p>
</body>
</html>
